# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/#stages.
image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim

stages:
  - build
  - test
  - validate

build-scripts:
  stage: build
  script:
    - cd scripts && uv sync
  artifacts:
    paths:
      - scripts/.venv
    expire_in: 1 hour

test-scripts:
  stage: test
  needs: ["build-scripts"]
  resource_group: database
  script:
    - cd scripts
    - cp "$DEV_APP_CONFIG_JSON" ./DevDbAppConfig.json
    - cp "$DEV_SERVICE_ACCOUNT_KEY" ./DevDbServiceAccountKey.json
    - source .venv/bin/activate
    - pytest -vv tests/test_database_schema.py

validate-database:
  stage: validate
  needs: ["build-scripts"]
  script:
    - cd scripts
    - cp "$PROD_APP_CONFIG_JSON" ./ProdDbAppConfig.json
    - cp "$PROD_SERVICE_ACCOUNT_KEY" ./ProdDbServiceAccountKey.json
    - source .venv/bin/activate
    - pytest -vv tests/test_production_database.py
